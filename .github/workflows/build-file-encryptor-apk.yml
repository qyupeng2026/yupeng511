name: Build File Encryptor APK

on:
  push:
    branches: [master, main]
    paths:
      - 'file_encryptor/**'
      - '.github/workflows/build-file-encryptor-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: file_encryptor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test (FENC 格式兼容性)
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: file-encryptor-apk
          path: file_encryptor/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
